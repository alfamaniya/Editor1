name: AlfaCode Tests

on:
  push:
    branches: [main]
    paths:
      - "alfacode/src/**"
      - "alfacode/tests/**"
      - ".github/workflows/alfacode-tests.yml"
  pull_request:
    paths:
      - "alfacode/src/**"
      - "alfacode/tests/**"
      - ".github/workflows/alfacode-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run AlfaCode tests
        run: node --experimental-default-type=module --test alfacode/tests/alfacode.test.mjs
