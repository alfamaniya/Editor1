name: AlfaCode Tests

on:
  push:
    branches: [main]
    paths:
      - "alfacode/src/**"
      - "alfacode/data/**"
      - "core/editor/**"
      - "core/completion-catalog/**"
      - "core/mobile-workspace/**"
      - "core/mobile-extra-keys/**"
      - "core/browser-storage/**"
      - "core/preview/**"
      - "core/clear-tabs/**"
      - "core/project-reset/**"
      - "core/clear-project-cookies/**"
      - "core/header/**"
      - "core/clear-tabs/**"
      - "core/project-reset/**"
      - "core/clear-project-cookies/**"
      - "core/workspace-divider/**"
      - "core/tag-suggestions/**"
      - "index.html"
      - "style.css"
      - "script.js"
      - "alfacode/tests/**"
      - ".github/workflows/alfacode-tests.yml"
  pull_request:
    paths:
      - "alfacode/src/**"
      - "alfacode/data/**"
      - "core/editor/**"
      - "core/preview/**"
      - "core/header/**"
      - "core/workspace-divider/**"
      - "index.html"
      - "style.css"
      - "script.js"
      - "alfacode/tests/**"
      - ".github/workflows/alfacode-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check integration JavaScript syntax
        run: node --experimental-default-type=module --check core/editor/editor.js && node --experimental-default-type=module --check core/mobile-workspace/mobile-workspace.js && node --experimental-default-type=module --check core/mobile-extra-keys/mobile-extra-keys.js && node --experimental-default-type=module --check core/browser-storage/browser-storage.js && node --experimental-default-type=module --check core/header/header.js && node --experimental-default-type=module --check core/clear-tabs/clear-tabs.js && node --experimental-default-type=module --check core/project-reset/project-reset.js && node --experimental-default-type=module --check core/clear-project-cookies/clear-project-cookies.js && node --experimental-default-type=module --check core/workspace-divider/workspace-divider.js && node --experimental-default-type=module --check core/tag-suggestions/tag-suggestions.js && node --check core/preview/preview.js && node --check script.js
      - name: Run AlfaCode tests
        run: node --experimental-default-type=module --test alfacode/tests/alfacode.test.mjs alfacode/tests/completions-data.test.mjs alfacode/tests/html-completion-shadow.test.mjs alfacode/tests/completion-runtime.test.mjs
