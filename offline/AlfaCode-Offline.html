<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10141d">
  <title>Editor1</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  background: #10141d;
  color: #e8edf5;
}
html, body { width: 100%; height: 100%; margin: 0; }
body { display: flex; flex-direction: column; min-height: 100%; overflow: hidden; }
app-header { display: block; flex: 0 0 54px; width: 100%; min-width: 0; }
.workspace {
  display: grid;
  flex: 1 1 auto;
  grid-template-columns: minmax(140px, 1fr) 6px minmax(140px, 1fr);
  gap: 0;
  width: 100%;
  min-width: 0;
  min-height: 0;
  overflow: auto;
}
.workspace-panel { min-width: 0; min-height: 0; overflow: hidden; background: #111722; }
.section-frame { display: block; width: 100%; height: 100%; min-height: 0; border: 0; background: transparent; }
workspace-divider { display: block; width: 6px; min-height: 100%; }

/* Responsive workspace layout */
@media (max-width: 700px) {
  html, body { height: 100%; min-height: 0; overflow: hidden; }
  body { height: 100%; }
  app-header { flex: 0 0 8%; }
  .workspace {
    grid-template-columns: 100% !important;
    grid-template-rows: minmax(0, 100%);
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
  }
  .workspace-panel { display: none; min-width: 0; min-height: 0; }
  body[data-mobile-view="editor"] .editor-panel,
  body[data-mobile-view="preview"] .preview-panel { display: block; }
  workspace-divider { display: none !important; }
  .section-frame { width: 100%; height: 100%; }
}

</style>
</head>
<body>
  <app-header>
    <clear-tabs-action slot="header-actions"></clear-tabs-action>
    <project-reset-action slot="header-actions"></project-reset-action>
    <clear-project-cookies-action slot="header-actions"></clear-project-cookies-action>
  </app-header>
  <mobile-workspace-switcher></mobile-workspace-switcher>
  <main class="workspace" aria-label="Editor workspace">
    <section class="workspace-panel editor-panel" aria-label="Code editor">
      <iframe class="section-frame" src="./core/editor/editor.html" title="Code editor"></iframe>
    </section>
    <workspace-divider></workspace-divider>
    <section class="workspace-panel preview-panel" aria-label="Live preview">
      <iframe class="section-frame" src="./core/preview/preview.html" title="Live preview"></iframe>

  class ClearTabsAction extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: "open" }); }

        fetch(new URL("clear-tabs.html", base)).then(r => { if (!r.ok) throw new Error("Unable to load clear-tabs markup."); return r.text(); }),

    const style = document.createElement("style"); style.textContent = css;
    const template = document.createElement("template"); template.innerHTML = markup;
    this.shadowRoot.append(style, template.content.cloneNode(true));

class OfflineWorkspaceDivider extends HTMLElement {
  connectedCallback() {
    if (this.shadowRoot) return;

    this.setAttribute("role", "separator");
    this.setAttribute("aria-label", "Resize editor and preview panels");
    this.setAttribute("aria-orientation", "vertical");
    this.setAttribute("aria-valuemin", "20");
    this.setAttribute("aria-valuemax", "80");
    this.setAttribute("aria-valuenow", "50");
    this.tabIndex = 0;
    this.dragging = false;
    this.addEventListener("pointerdown", event => {
      if (event.button !== undefined && event.button !== 0) return;
      this.dragging = true;
      this.setPointerCapture(event.pointerId);
      this.resizeAt(event.clientX);
      event.preventDefault();
    });
    this.addEventListener("pointermove", event => {
      if (this.dragging) this.resizeAt(event.clientX);
    });
    this.addEventListener("pointerup", () => { this.dragging = false; });
    this.addEventListener("pointercancel", () => { this.dragging = false; });
    this.addEventListener("keydown", event => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const workspace = this.closest(".workspace");
      if (!workspace) return;
      const usable = Math.max(workspace.clientWidth, workspace.scrollWidth) - 6;
      const minimum = Math.min(220, usable / 2);
      const current = Number(this.getAttribute("aria-valuenow")) || 50;
      const next = Math.max(minimum, Math.min(usable - minimum,
        usable * current / 100 + (event.key === "ArrowRight" ? 20 : -20)));
      this.apply(workspace, next, usable - next);
    });
    const workspace = this.closest(".workspace");
    if (workspace) {
      const usable = Math.max(0, Math.max(workspace.clientWidth, workspace.scrollWidth) - 6);
      this.apply(workspace, usable / 2, usable / 2);
    }
  }
  resizeAt(clientX) {
    const workspace = this.closest(".workspace");
    if (!workspace) return;
    const bounds = workspace.getBoundingClientRect();
    const usable = Math.max(workspace.clientWidth, workspace.scrollWidth) - 6;
    const minimum = Math.min(220, usable / 2);
    const left = Math.max(minimum, Math.min(usable - minimum, clientX - bounds.left + workspace.scrollLeft));
    this.apply(workspace, left, usable - left);
  }
  apply(workspace, left, right) {
    workspace.style.gridTemplateColumns = left + "px 6px " + right + "px";
    const total = left + right;
    const minPercent = total ? Math.ceil(Math.min(left, right) / total * 100) : 20;
    this.setAttribute("aria-valuemin", String(minPercent));
    this.setAttribute("aria-valuemax", String(100 - minPercent));
    this.setAttribute("aria-valuenow", String(total ? Math.round(left / total * 100) : 50));
  }

    root.addEventListener("click", event => {
      const button = event.target.closest("button[data-view]");
      if (button) this.setView(button.dataset.view);

    this.setView(document.body.dataset.mobileView || "editor");

    window.visualViewport?.addEventListener("resize", () => this.syncViewportHeight());
    window.addEventListener("resize", () => this.syncViewportHeight());
  }
  setView(view) {
    if (view !== "editor" && view !== "preview") return;
    document.body.dataset.mobileView = view;
    for (const button of this.shadowRoot.querySelectorAll("button[data-view]")) {

    } else if (!viewport) {
      document.documentElement.style.removeProperty("--app-height");
    }
  }
