<!-- #index-original-disabled.html: فایل index original disabled مربوط به بخش backup پروژه -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10141d">
  <title>Editor1</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <app-header>
    <clear-tabs-action slot="header-actions"></clear-tabs-action>
    <project-reset-action slot="header-actions"></project-reset-action>
    <clear-project-cookies-action slot="header-actions"></clear-project-cookies-action>
    <new-page-action slot="header-actions"></new-page-action>
  </app-header>
  <main class="workspace" aria-label="Editor workspace">
    <section class="workspace-panel editor-panel" aria-label="Code editor">
      <iframe class="section-frame" src="./core/editor/editor.html" title="Code editor"></iframe>
    </section>
    <workspace-divider></workspace-divider>
    <section class="workspace-panel preview-panel" aria-label="Live preview">
      <iframe class="section-frame" src="./core/preview/preview.html" title="Live preview"></iframe>
    </section>
  </main>
  <script type="module" src="./core/header/header.js"></script>
  <script type="module" src="./core/clear-tabs/clear-tabs.js"></script>
  <script type="module" src="./core/project-reset/project-reset.js"></script>
  <script type="module" src="./core/clear-project-cookies/clear-project-cookies.js"></script>
  <script type="module" src="./core/new-page-action/new-page-action.js"></script>
  <script type="module" src="./core/workspace-divider/workspace-divider.js"></script>
  <script src="./script.js"></script>
</body>
</html>
