<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor1 — Responsive Workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- نوار ابزار بالایی: دکمه‌ها به اکشن‌های مستقل متصل می‌شوند. -->
  <header class="main-header">
    <nav class="scroll-area" aria-label="Main toolbar">
      <button type="button" class="item" id="clearEditorData">clear editor data</button>
      <button type="button" class="item" id="resetProject">reset project</button>
      <button type="button" class="item" id="clearAllTabs">clear all tabs</button>
      <button type="button" class="item" id="clearCurrentTab">clear tab</button>
      <button type="button" class="item" id="codeCatalog">Code Catalog</button>
      <button type="button" class="item">map</button>
      <button type="button" class="item">2</button>
      <button type="button" class="item">3</button>
      <button type="button" class="item">4</button>
    </nav>
  </header>

  <!-- فضای کاری: پنل Editor و Preview با جداکننده قابل تغییر اندازه. -->
  <main class="split" id="split" dir="ltr">
    <section class="pane" id="leftPane" aria-label="Editor panel">
      <header class="pane-header">EDITOR</header>
      <div class="pane-content editor-content">
        <iframe id="editorFrame" class="workspace-frame" src="core/editor/editor.html" title="Code editor" loading="eager"></iframe>
      </div>
    </section>

    <div class="divider" id="divider" role="separator" aria-label="Resize panels" aria-orientation="vertical"></div>

    <section class="pane" id="rightPane" aria-label="Preview panel">
      <header class="pane-header">PREVIEW</header>
      <div class="pane-content preview-content">
        <iframe id="previewFrame" class="workspace-frame" src="core/preview/preview.html" title="Live preview" loading="eager"></iframe>
      </div>
    </section>
  </main>

  <!-- نوار پایین صفحه؛ آیتم‌ها در این مرحله هنوز اکشن مستقل ندارند. -->
  <footer class="main-footer">
    <div class="scroll-area" aria-label="Footer toolbar">
      <button type="button" class="item">1</button>
      <button type="button" class="item">2</button>
      <button type="button" class="item">3</button>
      <button type="button" class="item">4</button>
      <button type="button" class="item">5</button>
      <button type="button" class="item">6</button>
    </div>
  </footer>

  <script src="core/clear-editor-storage.js"></script>
  <script src="core/editor-bridge.js"></script>
  <!-- Helper Keys: sends selected symbol keys to AlfaCode Editor -->
  <script src="core/extra-key-action/extra-key-action.js"></script>
  <!-- اتصال دکمه Code Catalog به صفحه مرجع HTML، CSS و JavaScript -->
  <script type="module" src="core/new-page-action/new-page-action.js"></script>
</body>
</html>
