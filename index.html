<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10141d">
  <title>Editor1</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-brand" aria-label="AlfaCode">ALFA<span>CODE</span></div>
    <div class="header-content" aria-label="Main toolbar"></div>
  </header>
  <main class="workspace" aria-label="Editor workspace">
    <section class="workspace-panel editor-panel" aria-label="Code editor">
      <iframe class="section-frame" src="./core/editor/editor.html" title="Code editor"></iframe>
    </section>
    <div class="workspace-divider" role="separator" aria-label="Resize editor and preview panels"
         aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"
         tabindex="0"></div>
    <section class="workspace-panel preview-panel" aria-label="Live preview">
      <iframe class="section-frame" src="./core/preview/preview.html" title="Live preview"></iframe>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
