<!DOCTYPE html>
<html lang="en" dir="ltr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor1 — Responsive Workspace</title>
  <!-- CSS خارجی: استایل کلی دکمه‌های Header و Footer -->
  <link rel="stylesheet" href="style.css">
<style>
/* === style.css === */

    /* ریست اولیه: حذف فاصله‌های پیش‌فرض و یکسان‌سازی محاسبه ابعاد عناصر */
    /* ========== ریست ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* پایه صفحه: جلوگیری از اسکرول بیرونی، انتخاب فونت، رنگ متن و زمینه */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Tahoma, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    /* بدنه را به ستون تبدیل می‌کند و ارتفاع آن را برابر ارتفاع قابل‌مشاهده صفحه می‌گیرد */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;   /* ارتفاع واقعی viewport در موبایل */
    }

    /* ========== هدر و فوتر (با اسکرول افقی) ========== */
    /* نوارهای بالا و پایین در صورت زیاد بودن گزینه‌ها اسکرول افقی می‌گیرند. */
    .main-header,
    .main-footer {
      flex: 0 0 auto;
      background: #1f2937;
      color: #f9fafb;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #4b5563 #1f2937;
    }

    .main-header::-webkit-scrollbar,
    .main-footer::-webkit-scrollbar {
      height: 6px;
    }
    .main-header::-webkit-scrollbar-thumb,
    .main-footer::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 3px;
    }

    /* ظرف داخلی نوارها: گزینه‌ها را در یک ردیف نگه می‌دارد و در عرض کم قابل پیمایش است */
    .scroll-area {
      display: inline-flex;
      align-items: center;
      gap: clamp(0.5rem, 2vw, 1.25rem);
      padding: clamp(0.6rem, 2vw, 1rem) clamp(0.75rem, 3vw, 1.5rem);
      white-space: nowrap;
      min-width: 100%;
    }

    /* ========== بخش اصلی (دو پنل) ========== */
    /* ناحیه مرکزی بین Header و Footer؛ دو پنل در این بخش قرار می‌گیرند. */
    /* ساختار دوپنله: فضای باقی‌مانده صفحه را می‌گیرد و از سرریز محتوا جلوگیری می‌کند */
    .split {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* قواعد پایه هر پنل: چینش عمودی و محدود کردن اندازه/سرریز */
    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    /* پنل سمت چپ (Editor) با عرض اولیه ۵۰ درصد */
    #leftPane  { flex: 0 0 50%;   background: #ffffff; }
    #rightPane { flex: 1 1 auto;  background: #e5e7eb; }

    /* سربرگ داخلی هر پنل؛ عنوان Editor یا Preview را نشان می‌دهد */
    .pane-header {
      flex: 0 0 auto;
      padding: clamp(0.5rem, 1.5vw, 0.9rem) clamp(0.75rem, 2vw, 1.25rem);
      font-size: clamp(0.85rem, 1.8vw, 1rem);
      font-weight: bold;
      text-align: center;
      background: #d1d5db;
      border-bottom: 1px solid #9ca3af;
    }

    /* ناحیه محتوای پنل: مستقل از سربرگ اسکرول می‌شود و فضای قابل‌انعطاف می‌گیرد */
    .pane-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: clamp(0.75rem, 2vw, 1.5rem);
      font-size: clamp(0.85rem, 1.6vw, 1rem);
      line-height: 1.7;
    }

    /* فاصله پایین پاراگراف‌ها در محتوای پنل */
    .pane-content p { margin-bottom: 0.75rem; }

    /* ========== خط جداکننده‌ی قابل درگ ========== */
    /* Divider بین دو پنل است؛ کاربر با کشیدن آن می‌تواند نسبت عرض پنل‌ها را عوض کند. */
    /* نوار جداکننده: cursor مخصوص تغییر عرض و touch-action برای کنترل کشیدن */
    .divider {
      flex: 0 0 8px;
      background: #9ca3af;
      cursor: col-resize;
      position: relative;
      z-index: 5;
      transition: background 0.15s ease;
      touch-action: none;
    }

    /* ناحیه حساس بزرگ‌تر از خود Divider برای سهولت کلیک و لمس است */
    .divider::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -6px;
      right: -6px;
    }

    /* دستگیره وسط فقط تزئینی است و رویداد دریافت نمی‌کند */
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 48px;
      background: #e5e7eb;
      border-radius: 2px;
      opacity: 0.7;
      pointer-events: none;
    }

    /* رنگ Divider هنگام hover یا در حالت کشیدن */
    .divider:hover,
    .divider.dragging {
      background: #4b5563;
    }

    /* هنگام جابه‌جایی Divider، cursor سراسری و انتخاب متن غیرفعال می‌شود */
    body.dragging {
      cursor: col-resize;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========== تنظیمات اضافی برای موبایل‌های کوچک ========== */
    /* در عرض خیلی کم، Divider کمی ضخیم‌تر و پنل چپ کمی عریض‌تر می‌شود. */
    @media (max-width: 480px) {
      .divider { flex: 0 0 10px; }
      #leftPane { flex: 0 0 55%; }
    }
  
</style>
</head>
<body>
  <!-- Header شامل نوار افقی بالای صفحه؛ nav گزینه‌ها را به صورت یک ردیف قابل پیمایش می‌چیند. -->
  <header class="main-header">
    <nav class="scroll-area">
      <!-- گزینه پاک‌سازی کوکی‌ها؛ در نسخه فعلی فقط متن نمایشی است و اکشن ندارد. -->
      <button type="button" class="item">clear cookies</button>
      <!-- گزینه بازنشانی پروژه؛ فعلاً به رفتار جاوااسکریپت وصل نشده است. -->
      <button type="button" class="item">reset project</button>
      <!-- گزینه پاک کردن همه تب‌ها؛ فعلاً نمایشی و بدون اتصال است. -->
      <button type="button" class="item">clear all tabs</button>
      <!-- گزینه پاک کردن تب جاری؛ فعلاً نمایشی و بدون اتصال است. -->
      <button type="button" class="item">clear tab</button>
      <!-- گزینه JSON؛ متن نمونه برای جایگاه اکشن‌های هدر -->
      <button type="button" class="item">json</button>
      <!-- گزینه Map؛ متن نمونه برای جایگاه اکشن‌های هدر -->
      <button type="button" class="item">map</button>
      <!-- گزینه نمونه شماره ۲ -->
      <!-- گزینه فوتر شماره ۲ -->
      <button type="button" class="item">2</button>
      <!-- گزینه نمونه شماره ۳ -->
      <!-- گزینه فوتر شماره ۳ -->
      <button type="button" class="item">3</button>
      <!-- گزینه نمونه شماره ۴ -->
      <!-- گزینه فوتر شماره ۴ -->
      <button type="button" class="item">4</button>
    </nav>
  </header>

  <!-- ========== دو پنل ========== -->
  <main class="split" id="split" dir="ltr">

    <section class="pane" id="leftPane" dir="ltr">
      <!-- عنوان پنل ویرایش؛ نام آن در این نسخه به صورت متن ثابت نوشته شده است. -->
      <header class="pane-header">EDITOR</header>
      <!-- محتوای پنل Editor: در حال حاضر خالی، برای افزودن محتوا/ویرایشگر در آینده -->
      <div class="pane-content">
        </div>
    </section>

    <div class="divider" id="divider" aria-label="Resize panels"></div>

    <section class="pane" id="rightPane" dir="ltr">
      <!-- عنوان پنل پیش‌نمایش خروجی -->
      <header class="pane-header">PREVIEW</header>
      <!-- فضای Preview: هنوز iframe یا خروجی HTML در آن قرار داده نشده است. -->
      <div class="pane-content">
          </div>
    </section>

  </main>

  <!-- ========== فوتر ========== -->
  <footer class="main-footer">
    <!-- نوار گزینه‌های پایین؛ آیتم‌های عددی صرفاً نمونه‌اند و فعلاً اکشن ندارند. -->
    <div class="scroll-area">
      <!-- گزینه فوتر شماره ۱ -->
      <button type="button" class="item">1</button>
      <button type="button" class="item">2</button>
      <button type="button" class="item">3</button>
      <button type="button" class="item">4</button>
      <!-- گزینه فوتر شماره ۵ -->
      <button type="button" class="item">5</button>
      <!-- گزینه فوتر شماره ۶ -->
      <button type="button" class="item">6</button>
    </div>
  </footer>

  <!-- ========== جاوااسکریپت ========== -->
  

 
<script>
/* === script.js === */
/* این IIFE متغیرهای داخلی را در محدوده محلی نگه می‌دارد تا به فضای سراسری اضافه نشوند. */

    (function () {
      // دریافت ظرف اصلی دو پنل با شناسه split
      const split      = document.getElementById('split');
      // دریافت پنل چپ که عرض آن با کشیدن Divider تغییر می‌کند
      const leftPane   = document.getElementById('leftPane');
      // دریافت عنصر جداکننده برای ثبت رویداد شروع کشیدن
      const divider    = document.getElementById('divider');

      // مشخص می‌کند آیا کاربر در حال کشیدن Divider است
      let isDragging = false;
      // مختصات افقی اولیه Mouse یا Touch
      let startX = 0;
      // عرض اولیه پنل چپ قبل از شروع تعامل
      let startLeftWidth = 0;
      // عرض ظرف دو پنل؛ برای محاسبه محدودیت اندازه استفاده می‌شود
      let containerWidth = 0;

      // حداقل عرض مجاز هر پنل بر حسب پیکسل، تا هیچ پنل کاملاً جمع نشود
      const MIN_PANE = 100;

      // تابع کمکی: مختصات X را از رویداد Touch یا Mouse می‌خواند
      const getX = (e) => (e.touches ? e.touches[0].clientX : e.clientX);

      // شروع کشیدن: ذخیره نقطه شروع و اندازه فعلی پنل و ظرف
      function startDrag(e) {
        isDragging = true;
        startX = getX(e);
        startLeftWidth = leftPane.getBoundingClientRect().width;
        containerWidth = split.getBoundingClientRect().width;
        divider.classList.add('dragging');
        document.body.classList.add('dragging');
      }

      // حرکت Divider: اختلاف حرکت Mouse/Touch را به عرض پنل چپ تبدیل می‌کند
      function moveDrag(e) {
        if (!isDragging) return;
        const currentX = getX(e);
        // میزان حرکت افقی از محل شروع تا موقعیت فعلی
        const deltaX = currentX - startX;

        // عرض پیشنهادی پنل چپ با افزودن میزان حرکت به عرض اولیه
        let newWidth = startLeftWidth + deltaX;
        // سقف عرض پنل چپ؛ با حفظ حداقل عرض پنل راست محاسبه می‌شود
        const maxLeft = containerWidth - MIN_PANE;
        newWidth = Math.max(MIN_PANE, Math.min(maxLeft, newWidth));

        // تبدیل عرض محاسبه‌شده به درصد برای اعمال به flex-basis
        const percent = (newWidth / containerWidth) * 100;
        // اعمال عرض جدید؛ پنل راست فضای باقی‌مانده را می‌گیرد
        leftPane.style.flex = `0 0 ${percent}%`;

        // جلوگیری از رفتار پیش‌فرض رویداد در صورت امکان، مانند اسکرول ناخواسته
        if (e.cancelable) e.preventDefault();
      }

      // پایان کشیدن: پاک کردن حالت فعال و کلاس‌های نمایشی
      function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        divider.classList.remove('dragging');
        document.body.classList.remove('dragging');
      }

      // رویدادهای Mouse: آغاز کشیدن، دنبال‌کردن حرکت و پایان با رها کردن
      divider.addEventListener('mousedown', startDrag);
      window.addEventListener('mousemove', moveDrag);
      window.addEventListener('mouseup', endDrag);

      // رویدادهای لمسی: آغاز کشیدن و دنبال‌کردن حرکت انگشت
      divider.addEventListener('touchstart', startDrag, { passive: true });
      window.addEventListener('touchmove', moveDrag, { passive: false });
      window.addEventListener('touchend', endDrag);
      window.addEventListener('touchcancel', endDrag);
    })();
  
</script>
</body></html>
