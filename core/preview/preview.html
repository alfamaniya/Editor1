<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Preview</title>
  <link rel="stylesheet" href="./preview.css">
</head>
<body>
  <main class="section">
    <header class="section-header">
      <div><p class="eyebrow">OUTPUT</p><h1>Live Preview</h1></div>
      <span class="section-mark">02</span>
    </header>
    <div class="preview-surface">
      <div class="preview-top"><span class="preview-indicator"></span><span>PREVIEW WINDOW</span><span id="preview-status">Waiting for code</span></div>
      <iframe id="preview-frame" title="Code output" sandbox="allow-scripts"></iframe>
    </div>
  </main>
  <script src="./preview.js"></script>
</body>
</html>
