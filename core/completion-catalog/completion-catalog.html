<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10141d">
  <title>Completion Catalog | AlfaCode</title>
  <link rel="stylesheet" href="./completion-catalog.css">
</head>
<body>
  <main class="catalog">
    <header class="page-header">
      <div><p class="eyebrow">ALFACODE REFERENCE</p><h1>فهرست تکمیل خودکار</h1><p class="subtitle">فهرست زنده پیشنهادهای HTML، CSS و JavaScript</p></div>
      <a href="../" class="back-link">بازگشت به ویرایشگر</a>
    </header>
    <section class="toolbar" aria-label="Catalog filters">
      <div class="language-tabs" role="tablist" aria-label="زبان">
        <button type="button" role="tab" data-language="all" aria-selected="true">همه زبان‌ها</button>
        <button type="button" role="tab" data-language="html" aria-selected="false">HTML</button>
        <button type="button" role="tab" data-language="css" aria-selected="false">CSS</button>
        <button type="button" role="tab" data-language="javascript" aria-selected="false">JavaScript</button>
      </div>
      <label class="search"><span>جست‌وجو</span><input id="search" type="search" placeholder="نام، دسته یا توضیح..." autocomplete="off"></label>
    </section>
    <section class="summary" aria-live="polite"><strong id="count">0</strong><span>مورد در فهرست</span><span id="updated"></span></section>
    <p id="load-errors" class="load-errors" role="alert" hidden></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>زبان</th><th>دسته‌بندی</th><th>واژه / پیشنهاد</th><th>توضیحات</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4">در حال بارگذاری فهرست...</td></tr></tbody>
      </table>
    </div>
    <p class="footnote">این جدول مستقیماً از سه فایل JSON مستقل HTML، CSS و JavaScript بارگذاری می‌شود.</p>
  </main>
  <script type="module" src="./completion-catalog.js"></script>
</body>
</html>
