<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor</title>
  <link rel="stylesheet" href="./editor.css">
</head>
<body>
  <main class="section">
    <header class="section-header">
      <div>
        <p class="eyebrow">WORKSPACE</p>
        <h1>Editor</h1>
      </div>
      <span class="section-mark">01</span>
    </header>
    <div class="editor-surface" aria-label="Editor visual area">
      <div class="surface-top">
        <span class="dot dot-one"></span>
        <span class="dot dot-two"></span>
        <span class="dot dot-three"></span>
        <span class="surface-label">CODE AREA</span>
      </div>
      <div class="editor-placeholder">
        <span class="line-number">01</span>
        <span class="placeholder-line"></span>
      </div>
    </div>
  </main>
  <script src="./editor.js"></script>
</body>
</html>
