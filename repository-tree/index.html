<!-- #index.html: رابط کاربری صفحه مستقل درخت مخزن و بخش نمایش وضعیت و ساختار فایل‌ها -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor1 — Repository Tree</title>
  <link rel="stylesheet" href="repository-tree.css">
</head>
<body>
  <header class="page-header">
    <div class="heading">
      <h1>Repository Tree</h1>
      <p>Live file and folder structure from the GitHub repository.</p>
    </div>
    <div class="toolbar">
      <button type="button" id="refreshTree">Refresh</button>
      <button type="button" id="expandAll">Expand all</button>
      <button type="button" id="collapseAll">Collapse all</button>
    </div>
  </header>
  <main>
    <section class="tree-card" aria-label="Repository tree">
      <div class="tree-meta">
        <span id="treeStatus" role="status">Loading repository tree…</span>
        <span id="treeCounts"></span>
      </div>
      <div id="treeRoot" class="tree-root"></div>
    </section>
  </main>
  <script src="repository-tree.js"></script>
</body>
</html>
